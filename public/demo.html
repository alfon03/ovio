function welcome(){return `<div class="welcome fade-in"><section class="welcome-art">${logo()}<div><div class="eyebrow">La nueva escena musical</div><h1>Descubre música<br><span class="grad-text">antes que nadie.</span></h1><p>Escucha canciones y álbumes, sigue a artistas emergentes y crea playlists para compartir con tu gente.</p><div class="accent-line"></div></div><div class="small">OVIO · Beta conceptual · Sin anuncios ni monetización</div><div class="welcome-cover">${logo(true)}</div></section><section class="welcome-card"><span class="chip" style="align-self:flex-start">${icon('sparkles',15)} Vista previa interactiva</span><h2>Tu música empieza aquí.</h2><p>Entra y prueba cómo sería OVIO tras iniciar sesión.</p><form id="signin"><div class="form-field"><label for="demo-name">¿Cómo quieres llamarte?</label><input id="demo-name" name="name" maxlength="40" placeholder="Tu nombre o apodo" value="${escap(S.user.name)}" required></div><button class="btn primary" type="submit">Entrar a OVIO ${icon('right')}</button><div class="notice" style="margin-top:18px">Esta es una <b>demo local</b>: no necesitas correo ni contraseña, y no se crean cuentas reales. Las playlists y preferencias se guardan solo en este navegador.</div></form></section></div>`}
function appShell(){return `<div class="shell fade-in"><aside class="sidebar"><a href="ovio-landing.html" title="Ir a la landing" class="brand-link">${logo()}</a><div class="slabel">Tu música</div>${menu.map(navBtn).join('')}<div class="slabel">Tu espacio</div><button class="navitem ${route.name==='profile'?'active':''}" data-action="nav" data-route="profile">${icon('user')}<span>Mi perfil</span></button><button class="navitem ${route.name==='studio'?'active':''}" data-action="nav" data-route="studio">${icon('mic')}<span>Estudio de artista</span></button><div class="sidebar-bottom"><button class="btn primary" data-action="create-playlist">${icon('plus',16)} Crear playlist</button><p class="tip">Un lugar para descubrir talento. Beta de demostración, sin cuentas ni audios publicados.</p></div></aside><main class="main" id="main"><header class="topbar"><div class="topbar-left"><button class="iconbtn" data-action="back" aria-label="Volver">${icon('left')}</button><button class="searchquick" data-action="nav" data-route="search">${icon('search')}<span>¿Qué quieres escuchar?</span></button></div><div class="topbar-right"><span class="pill purple">BETA</span><button class="btn tiny ghost" data-action="nav" data-route="studio" style="white-space:nowrap">${icon('upload',14)} <span class="show-desktop">Soy artista</span></button><button class="iconbtn" data-action="nav" data-route="profile" title="Mi perfil" aria-label="Mi perfil">${avatar()}</button></div></header><div class="main-content fade-in" id="view">${view()}</div></main><aside class="rightbar"><div class="aside-hero"><div class="eyebrow" style="font-size:9px">OVIO RADAR</div><strong>Descubre antes que el resto.</strong><p>Artistas emergentes con menos de 1.000 seguidores.</p><button class="btn tiny primary" data-action="nav" data-route="radar">Ir al radar ${icon('right',13)}</button></div><h3>Nuevos talentos</h3>${[A[3],A[1],A[5],A[0]].map(x=>`<div class="mini-artist">${cover(A.indexOf(x),{})}<div style="min-width:0"><strong>${x.name}</strong><small>${x.genre} · ${x.followers} seguidores</small></div><button class="btn tiny ${S.follows.includes(x.id)?'active':''}" title="${S.follows.includes(x.id)?'Dejar de seguir':'Seguir'}" data-action="follow" data-id="${x.id}">${icon(S.follows.includes(x.id)?'check':'plus',15)}</button></div>`).join('')}<hr class="hr"><h3>Tu escucha</h3><p class="small">${S.history.length?'Ya has descubierto '+S.history.length+' canciones diferentes.':'Empieza a escuchar para personalizar tus recomendaciones.'}</p><button class="btn ghost tiny" data-action="nav" data-route="library">Ver tu biblioteca ${icon('right',14)}</button><hr class="hr"><p class="tip">Las recomendaciones aquí se calculan a partir de géneros escuchados y favoritos de esta demo, no mediante IA ni un servicio real.</p></aside><div class="player" id="player">${playerHTML()}</div><nav class="mobilebar">${[['home','home','Inicio'],['search','search','Buscar'],['library','library','Biblioteca'],['community','users','Social'],['profile','user','Perfil']].map(([path,ic,t])=>`<button data-action="nav" data-route="${path}" class="${route.name===path?'active':''}">${icon(ic)}<span>${t}</span></button>`).join('')}</nav></div>`}
const draw=()=>{document.getElementById('app').innerHTML=S.loggedIn?appShell():welcome()};
const trackCard=t=>`<button class="music-card" data-action="play" data-id="${t.id}" aria-label="Escuchar una demostración de ${escap(t.title)}">${cover(t.cover,{label:t.title})}<strong class="ellipsis">${escap(t.title)}</strong><span class="ellipsis">${a(t.artist).name} · ${t.genre}</span><span class="float-play">${icon('play',19)}</span></button>`;
const albumCard=x=>`<button class="music-card" data-action="album" data-id="${x.id}">${cover(x.cover,{label:x.title})}<strong class="ellipsis">${escap(x.title)}</strong><span class="ellipsis">${x.type} · ${a(x.artist).name}</span><span class="float-play">${icon('right',19)}</span></button>`;
const artistCard=x=>`<button class="artist-tile" data-action="artist" data-id="${x.id}">${portrait(x)}<strong>${x.name}</strong><small>${x.genre} · ${x.followers} seguidores</small></button>`;
const heading=(title,right='',action='',id='')=>`<div class="section-head"><h2>${title}</h2>${right?`<button class="link" data-action="${action||'nav'}" ${id?`data-route="${id}"`:''}>${right} ${icon('right',14)}</button>`:''}</div>`;
function recommend(){const weights={};for(const [tid,plays] of Object.entries(S.listens)) {const x=song(tid);if(x)weights[x.genre]=(weights[x.genre]||0)+plays*3;}for(const tid of S.likes){const x=song(tid);if(x)weights[x.genre]=(weights[x.genre]||0)+5;}for(const aid of S.follows){const x=a(aid);if(x)weights[x.genre]=(weights[x.genre]||0)+4;}for(const g of S.interests) weights[g]=(weights[g]||0)+3;const result=SONGS.map((t,i)=>({...t,score:(weights[t.genre]||0)+(!S.history.includes(t.id)?2:0)+(i*17%5)/10})).sort((x,y)=>y.score-x.score);return {items:result.slice(0,10),genre:Object.entries(weights).sort((x,y)=>y[1]-x[1])[0]?.[0]||null};}
function home(){const reco=recommend(),again=S.history.slice(0,6).map(song).filter(Boolean);return `<div class="hero"><div class="eyebrow">Bienvenido, ${escap(S.user.name)} ✦</div><h1>La próxima gran canción<br><span class="grad-text">está por descubrir.</span></h1><p>Escucha, conecta y apoya a músicos que todavía no conoces. Todo comienza con una reproducción.</p><button class="btn primary" data-action="nav" data-route="radar">${icon('sparkles',17)} Explorar nuevos talentos</button></div>${heading(reco.genre?'Hecho para ti · '+reco.genre:'Hecho para ti','Ver todo','nav','explore')}<p class="small" style="margin:-8px 0 15px">${reco.genre?'Basado en tus escuchas, favoritos y artistas seguidos.':'Empieza a escuchar y las recomendaciones cambiarán según tus gustos.'}</p><div class="music-grid">${reco.items.slice(0,5).map(trackCard).join('')}</div>${again.length?`${heading('Volver a escuchar','Tu historial','nav','library')}<div class="music-grid">${again.slice(0,5).map(trackCard).join('')}</div>`:''}${heading('Nuevos álbumes y EPs','Todos','nav','explore')}<div class="music-grid">${[AL[2],AL[0],AL[1],AL[5],AL[6]].map(albumCard).join('')}</div><div class="banner-small"><div><div class="eyebrow">Descubrimiento real</div><strong>Talentos con menos de 1.000 seguidores.</strong><span>El algoritmo no debería olvidar a quienes están empezando.</span></div><button class="btn ghost" data-action="nav" data-route="radar">Entrar al radar ${icon('right',14)}</button></div>${heading('Quizá te gusten estos artistas','Descubrir','nav','radar')}<div class="artist-grid">${[A[1],A[3],A[0],A[6],A[5]].map(artistCard).join('')}</div>${heading('Playlists de la comunidad','Ver más','nav','community')}<div class="playlist-list">${COMMUNITY.map(publicCard).join('')}</div>`}
function genreButtons(selected,scope){return `<div class="filters">${G.map(g=>`<button class="chip ${selected===g?'selected':''}" data-action="genre" data-scope="${scope}" data-genre="${g}">${g}</button>`).join('')}</div>`}
function explore(){const picks=exploreGenre==='Todos'?SONGS:SONGS.filter(t=>t.genre===exploreGenre);const als=exploreGenre==='Todos'?AL:AL.filter(x=>x.genre===exploreGenre);const gs=[['Urbano','#7428a8','#e46a95'],['Trap','#5024b9','#371d61'],['Indie','#bc5998','#4344a1'],['Electrónica','#12617f','#563ac0'],['Pop','#c47d69','#9d3f89'],['Rap','#49459d','#232e55'],['R&B','#97507d','#271f66']];return `<div class="eyebrow">Explora OVIO</div><h1 class="subheading">Encuentra tu próximo sonido.</h1><p class="muted">Música original, artistas emergentes y colecciones completas.</p><div class="genre-grid">${gs.map(([g,c1,c2])=>`<button class="genre" style="--g1:${c1};--g2:${c2}" data-action="genre" data-scope="explore" data-genre="${g}">${g}</button>`).join('')}</div>${genreButtons(exploreGenre,'explore')}${heading(`Canciones ${exploreGenre==='Todos'?'para descubrir':'de '+exploreGenre}`)}${trackRows(picks)}${heading('Álbumes y EPs')}<div class="music-grid">${als.map(albumCard).join('')}</div>`}
function trackRows(arr){if(!arr.length)return `<div class="empty">Todavía no hay canciones aquí.</div>`;return `<div class="tracks">${arr.map((t,i)=>`<div class="track-row"><button class="iconact num" data-action="play" data-id="${t.id}" title="Reproducir">${playback.id===t.id&&playback.playing?icon('pause',17):String(i+1).padStart(2,'0')}</button>${cover(t.cover,{mini:true})}<div style="min-width:0"><button class="link ellipsis" style="font-size:12px;color:#f6f5ff;padding:0;text-align:left" data-action="play" data-id="${t.id}"><strong class="ellipsis">${escap(t.title)}</strong></button><small><button class="link" style="font-size:11px;color:#9796ae;padding:0" data-action="artist" data-id="${t.artist}">${a(t.artist).name}</button></small></div><button class="album-name link" style="text-align:left;padding:0" data-action="album" data-id="${t.album}">${escap(album(t.album)?.title||'Single')}</button><span class="duration small">${fmt(t.duration)}</span><div class="track-actions"><button class="iconact ${S.likes.includes(t.id)?'active':''}" data-action="like" data-id="${t.id}" title="${S.likes.includes(t.id)?'Quitar de favoritos':'Añadir a favoritos'}">${icon('heart')}</button><button class="iconact" data-action="add-track" data-id="${t.id}" title="Añadir a playlist">${icon('plus')}</button><button class="iconact" data-action="share-song" data-id="${t.id}" title="Compartir canción">${icon('share')}</button></div></div>`).join('')}</div>`}
function searchResults(){const q=searchTerm.trim().toLowerCase();if(!q)return `<div class="eyebrow">¿Por dónde empezamos?</div><h2 class="subheading">Busca lo que te mueve.</h2><p class="muted">Artistas, canciones, álbumes, playlists o géneros.</p><div class="genre-grid">${[['Trap','#6e40b7','#222961'],['Indie','#be679e','#492e82'],['Electrónica','#167c98','#4436a2'],['Pop','#b76780','#773d6a']].map(([g,c1,c2])=>`<button class="genre" style="--g1:${c1};--g2:${c2}" data-action="search-genre" data-genre="${g}">${g}</button>`).join('')}</div>`;const ts=SONGS.filter(t=>(t.title+' '+a(t.artist).name+' '+t.genre+' '+album(t.album).title).toLowerCase().includes(q)),arts=A.filter(x=>(x.name+' '+x.genre+' '+x.city).toLowerCase().includes(q)),als=AL.filter(x=>(x.title+' '+a(x.artist).name+' '+x.type).toLowerCase().includes(q)),ps=[...COMMUNITY,...S.playlists].filter(x=>(x.name+' '+(x.description||x.desc||'')).toLowerCase().includes(q));if(!ts.length&&!arts.length&&!als.length&&!ps.length)return `<div class="empty">${icon('search',28)}<strong>Sin resultados para «${escap(searchTerm)}»</strong>Prueba con otro nombre o género.</div>`;return `${ts.length?`${heading('Canciones')} ${trackRows(ts)}`:''}${arts.length?`${heading('Artistas')}<div class="artist-grid">${arts.map(artistCard).join('')}</div>`:''}${als.length?`${heading('Álbumes y EPs')}<div class="music-grid">${als.map(albumCard).join('')}</div>`:''}${ps.length?`${heading('Playlists')}<div class="playlist-list">${ps.map(x=>COMMUNITY.some(p=>p.id===x.id)?publicCard(x):ownCard(x)).join('')}</div>`:''}`}
function search(){return `<div class="eyebrow">Buscar en OVIO</div><h1 class="subheading">¿Qué quieres escuchar?</h1><div class="form-field" style="margin-bottom:25px"><input id="search-input" type="search" autocomplete="off" autofocus placeholder="Busca artistas, canciones, álbumes, géneros…" value="${escap(searchTerm)}" style="padding:17px 19px;border-radius:35px;font-size:16px"></div><div id="search-results">${searchResults()}</div>`}
function radar(){const ar=radarGenre==='Todos'?A:A.filter(x=>x.genre===radarGenre);return `<div class="eyebrow">Un poco antes que todos</div><h1 class="subheading">Radar de emergentes ✦</h1><p class="muted">Una sección propia de OVIO: aquí no manda quién tiene más reproducciones. Todos estos perfiles tienen menos de 1.000 seguidores.</p>${genreButtons(radarGenre,'radar')}${heading('Artistas por descubrir')}<div class="artist-grid">${ar.map(artistCard).join('')}</div><div class="notice cyan">${icon('info',15)} Las cifras y los artistas son ficticios. En la beta real, el radar deberá mostrar música aprobada y dar oportunidades de descubrimiento sin vender posiciones orgánicas.</div>`}
function albumView(id){const x=album(id);if(!x)return '<div class="empty">Álbum no encontrado.</div>';const ts=SONGS.filter(t=>t.album===id);return `<div class="album-banner">${cover(x.cover,{label:x.title})}<div><span class="eyebrow">${x.type} · ${x.genre}</span><h1>${escap(x.title)}</h1><p><button class="link" data-action="artist" data-id="${x.artist}">${a(x.artist).name}</button> · ${ts.length} canciones · ${fmt(ts.reduce((sum,t)=>sum+t.duration,0))}</p><div class="tagrow"><button class="btn primary" data-action="play" data-id="${ts[0].id}">${icon('play',16)} Reproducir</button><button class="btn ghost" data-action="save-album" data-id="${x.id}">${icon(S.savedAlbums.includes(x.id)?'check':'plus',16)} ${S.savedAlbums.includes(x.id)?'Guardado':'Guardar álbum'}</button></div></div></div>${heading('Canciones')}${trackRows(ts)}<div class="notice">${icon('shield',17)} Cuando OVIO sea real, todas las pistas de un álbum deberán aprobarse por moderación antes de hacerse públicas.</div>`}
function artistView(id){const x=a(id);if(!x)return '<div class="empty">Artista no encontrado.</div>';const songs=SONGS.filter(t=>t.artist===id);return `<div class="profile-banner">${portrait(x)}<div style="flex:1;min-width:0"><div class="eyebrow">Artista emergente · ${x.genre}</div><h1>${x.name}</h1><p>${x.city} · ${x.followers} seguidores (datos ficticios)</p><div class="tagrow"><button class="btn primary" data-action="follow" data-id="${x.id}">${icon(S.follows.includes(x.id)?'check':'plus',16)} ${S.follows.includes(x.id)?'Siguiendo':'Seguir'}</button><button class="btn ghost" data-action="play" data-id="${songs[0].id}">${icon('play',15)} Escuchar</button></div></div></div><p class="muted">${x.bio}</p>${heading('Canciones populares')}${trackRows(songs)}${heading('Discografía')}<div class="music-grid">${AL.filter(y=>y.artist===id).map(albumCard).join('')}</div>`}
const ownCard=x=>`<div class="playlist-tile" data-action="playlist" data-id="${x.id}" role="button" tabindex="0">${cover(x.cover??1,{label:x.name})}<strong>${escap(x.name)}</strong><small>${x.tracks.length} canciones · ${x.public?'Pública':'Privada'}</small></div>`;
const publicCard=x=>`<div class="playlist-tile" data-action="publicplaylist" data-id="${x.id}" role="button" tabindex="0">${cover(x.cover,{label:x.name})}<strong>${escap(x.name)}</strong><small>Por ${escap(x.owner)} · Pública</small></div>`;
function library(){const t=libraryTab,items=[['all','Todo'],['playlists','Playlists'],['likes','Me gusta'],['albums','Álbumes'],['artists','Artistas'],['history','Recientes']];const allPlay=S.playlists;let content='';if(t==='all'||t==='playlists')content+=`${heading('Tus playlists')}<div class="tagrow" style="margin-bottom:12px"><button class="btn primary tiny" data-action="create-playlist">${icon('plus',15)} Nueva playlist</button></div><div class="playlist-list" style="margin-bottom:24px">${allPlay.map(ownCard).join('')||'<div class="empty">Todavía no has creado playlists.</div>'}${S.followedPublic.map(id=>publicList(id)).filter(Boolean).map(publicCard).join('')}</div>`;if(t==='all'||t==='likes')content+=`${heading('Tus favoritas')}${trackRows(S.likes.map(song).filter(Boolean))}`;if(t==='all'||t==='albums')content+=`${heading('Álbumes guardados')}${S.savedAlbums.length?`<div class="music-grid">${S.savedAlbums.map(album).filter(Boolean).map(albumCard).join('')}</div>`:'<div class="empty">Guarda un álbum para encontrarlo aquí.</div>'}`;if(t==='all'||t==='artists')content+=`${heading('Artistas que sigues')}${S.follows.length?`<div class="artist-grid">${S.follows.map(a).filter(Boolean).map(artistCard).join('')}</div>`:'<div class="empty">Sigue a un artista para no perderte sus novedades.</div>'}`;if(t==='all'||t==='history')content+=`${heading('Escuchado recientemente')}${trackRows(S.history.map(song).filter(Boolean))}`;return `<div class="eyebrow">Tu espacio</div><h1 class="subheading">Tu biblioteca.</h1><p class="muted">Guarda la música que te acompaña.</p><div class="filters">${items.map(([id,label])=>`<button class="chip ${id===t?'selected':''}" data-action="library-tab" data-id="${id}">${label}</button>`).join('')}</div>${content}`}
function playlistView(id,isPublic){const x=isPublic?publicList(id):list(id);if(!x)return '<div class="empty">No existe esta playlist.</div>';const mine=!isPublic;return `<div class="playlist-banner">${cover(x.cover??1,{label:x.name})}<div style="min-width:0"><div class="eyebrow">${mine?(x.public?'Playlist pública':'Playlist privada'):'Playlist de la comunidad'}</div><h1>${escap(x.name)}</h1><p>${escap(x.description||x.desc||'')} · ${x.tracks.length} canciones</p><div class="tagrow">${x.tracks[0]?`<button class="btn primary" data-action="play" data-id="${x.tracks[0]}">${icon('play',15)} Escuchar</button>`:''}${mine?`<button class="btn ghost" data-action="edit-playlist" data-id="${x.id}">${icon('edit',14)} Editar</button>`:`<button class="btn ghost" data-action="save-public" data-id="${x.id}">${icon(S.followedPublic.includes(id)?'check':'plus',15)} ${S.followedPublic.includes(id)?'Guardada':'Guardar lista'}</button>`}<button class="btn ghost" data-action="share-playlist" data-id="${id}" data-public="${isPublic?'1':'0'}">${icon('share',15)} Compartir</button></div></div></div>${heading(`Canciones · ${x.tracks.length}`)}${trackRows(x.tracks.map(song).filter(Boolean))}${mine?`<button class="btn ghost" data-action="add-any" data-id="${x.id}">${icon('plus',16)} Añadir canciones</button>`:''}${mine&&!x.public?`<p class="small" style="margin-top:14px">${icon('lock',13)} Solo tú puedes ver esta playlist. Cámbiala a pública desde «Editar».</p>`:''}`}
function community(){const ownPublic=S.playlists.filter(x=>x.public);return `<div class="eyebrow">La música se comparte</div><h1 class="subheading">Comunidad.</h1><p class="muted">Comparte playlists públicas, sigue artistas y participa en la escena emergente.</p>${heading('Playlists públicas') }<div class="playlist-list" style="margin-bottom:34px">${COMMUNITY.map(publicCard).join('')}${ownPublic.map(ownCard).join('')}</div>${heading('De tus artistas y la comunidad')}${FEED.map(f=>`<article class="social-card"><div class="social-head">${portrait(a(f.artist))}<div style="flex:1"><strong>${a(f.artist).name} <span class="pill purple">Artista</span></strong><span class="small">${f.time} · ${a(f.artist).genre}</span></div><button class="btn tiny ghost" data-action="artist" data-id="${f.artist}">Ver perfil</button></div><p>${escap(f.message)}</p><div class="cardline" style="display:flex;align-items:center;gap:13px;padding:9px">${cover(song(f.track).cover)}<div style="flex:1"><strong>${song(f.track).title}</strong><div class="small">${a(f.artist).name}</div></div><button class="btn tiny primary" data-action="play" data-id="${f.track}">${icon('play',15)}</button></div><div class="social-actions" style="margin-top:15px"><button class="btn tiny ${S.feedLikes.includes(f.id)?'active':'ghost'}" data-action="feed-like" data-id="${f.id}">${icon('heart',15)} ${S.feedLikes.includes(f.id)?'Te gusta':'Me gusta'}</button><button class="btn tiny ghost" data-action="share-song" data-id="${f.track}">${icon('share',14)} Compartir canción</button></div></article>`).join('')}<p class="hint">Las publicaciones son ficticias. Los «Me gusta» de esta demo solo se guardan en tu navegador.</p>`}
function profile(){return `<div class="eyebrow">Mi cuenta</div><h1 class="subheading">Tu perfil.</h1><div class="profile-banner">${avatar('large')}<div><div class="eyebrow">${labelRole()}</div><h1>${escap(S.user.name)}</h1><p>${escap(S.user.bio)}</p><button class="btn ghost tiny" data-action="settings">${icon('edit',14)} Editar perfil</button></div></div><div class="stats"><div class="stat"><strong>${S.likes.length}</strong><span>Favoritas</span></div><div class="stat"><strong>${S.playlists.length}</strong><span>Playlists</span></div><div class="stat"><strong>${S.follows.length}</strong><span>Artistas seguidos</span></div></div><div class="cardline" style="margin-bottom:17px"><h2 style="margin:0 0 9px;font-size:18px">${icon('mic')} ¿También haces música?</h2><p class="muted">Puedes solicitar un perfil de artista para subir singles y crear álbumes originales. Las publicaciones necesitarán revisión.</p>${S.artistRequest?`<span class="pill purple">Solicitud de artista pendiente de revisión</span><div style="margin-top:12px"><button class="btn ghost" data-action="nav" data-route="studio">Ver estudio en modo demo ${icon('right',15)}</button></div>`:`<button class="btn primary" data-action="artist-apply">Solicitar perfil de artista ${icon('right',15)}</button>`}</div><div class="tagrow"><button class="btn ghost" data-action="settings">${icon('settings')} Ajustes</button><button class="btn ghost" data-action="create-playlist">${icon('plus')} Crear playlist</button><button class="btn ghost" data-action="logout">${icon('logout')} Salir de demo</button></div>`}
function settings(){return `<div class="eyebrow">Personalización</div><h1 class="subheading">Editar perfil.</h1><p class="muted">Personaliza cómo aparecerías en OVIO. Los cambios se guardan localmente.</p><div class="settings-grid"><form id="settings-form" class="cardline"><div class="form-field"><label>Nombre o apodo</label><input name="name" required maxlength="40" value="${escap(S.user.name)}"></div><div class="form-field"><label>Biografía</label><textarea name="bio" maxlength="250">${escap(S.user.bio)}</textarea></div><div class="form-field"><label>Ciudad o ubicación (opcional)</label><input name="city" maxlength="60" value="${escap(S.user.city)}"></div><button class="btn primary" type="submit">${icon('check',16)} Guardar cambios</button></form><div class="cardline" style="align-self:start;text-align:center">${avatar('large')}<h3>Foto de perfil</h3><p class="small">PNG, JPG o WebP de hasta 500 KB.</p><label class="btn ghost tiny" for="avatar-file">${icon('camera',15)} Elegir imagen</label><input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp" style="display:none"><button class="btn tiny ghost" data-action="remove-avatar" style="margin-top:8px">Quitar foto</button></div></div><hr class="hr"><button class="btn danger" data-action="clear-history">${icon('trash')} Borrar historial de escuchas</button><p class="hint">No hay servidor conectado. Esta demo no guarda información fuera de este navegador.</p>`}
function studio(){return `<div class="eyebrow">Herramientas para creadores</div><h1 class="subheading">Tu estudio musical.</h1>${!S.artistRequest?`<div class="banner-small"><div><strong>Convierte tu perfil en artista.</strong><span>Registra una solicitud para probar las herramientas.</span></div><button class="btn primary" data-action="artist-apply">Solicitar acceso ${icon('right')}</button></div>`:`<div class="notice">${icon('shield',16)} Tu solicitud de artista está <b>pendiente</b>. Puedes explorar el estudio y crear borradores de prueba, pero no se publican canciones ni se envían documentos a un administrador real.</div>`}<div class="stats" style="margin-top:19px"><div class="stat"><strong>${S.draftSongs.length}</strong><span>Canciones de prueba</span></div><div class="stat"><strong>${S.draftAlbums.length}</strong><span>Álbumes de prueba</span></div><div class="stat"><strong>0</strong><span>Publicadas (beta demo)</span></div></div><div class="upload-grid"><div class="cardline"><div class="eyebrow">Lanzamiento</div><h2 style="margin:9px 0">${icon('upload')} Subir canción</h2><p class="muted">Single individual o una canción asociada a un álbum.</p><button class="btn primary" data-action="draft-song">Crear canción ${icon('plus',14)}</button></div><div class="cardline"><div class="eyebrow">Discografía</div><h2 style="margin:9px 0">${icon('disc')} Crear álbum o EP</h2><p class="muted">Organiza las pistas antes de solicitar la revisión.</p><button class="btn ghost" data-action="draft-album">Crear álbum ${icon('plus',14)}</button></div></div>${heading('Álbumes en preparación')}<div class="playlist-list" style="margin-bottom:22px">${S.draftAlbums.map((x,i)=>`<div class="cardline">${cover(i+4,{label:x.title})}<strong style="display:block;margin-top:9px">${escap(x.title)}</strong><span class="small">${x.type} · ${S.draftSongs.filter(t=>t.album===x.id).length} pistas · No publicado</span></div>`).join('')||'<div class="empty">Todavía no tienes álbumes en preparación.</div>'}</div>${heading('Canciones en preparación')}<div class="tracks">${S.draftSongs.map((t,i)=>`<div class="track-row" style="grid-template-columns:20px 40px 1fr auto"><span class="num">${i+1}</span>${cover(i+2,{mini:true})}<div><strong>${escap(t.title)}</strong><small>${escap(t.fileName||'Sin archivo')} · ${t.album?escap(S.draftAlbums.find(x=>x.id===t.album)?.title||'Álbum'):'Single'}</small></div><span class="pill purple">Borrador local</span></div>`).join('')||'<div class="empty">Todavía no has creado ninguna canción de prueba.</div>'}</div>`}
function view(){switch(route.name){case'home':return home();case'explore':return explore();case'search':return search();case'radar':return radar();case'album':return albumView(route.id);case'artist':return artistView(route.id);case'library':return library();case'playlist':return playlistView(route.id,false);case'publicplaylist':return playlistView(route.id,true);case'community':return community();case'profile':return profile();case'settings':return settings();case'studio':return studio();default:return home();}}
function playerHTML(){const t=song(playback.id);return `<div class="playing-info">${t?cover(t.cover,{mini:true}):cover(2)}<div style="min-width:0"><strong class="ellipsis">${t?escap(t.title):'Nada en reproducción'}</strong><span class="ellipsis">${t?a(t.artist).name+' · Vista previa sintética':'Elige una canción para empezar'}</span></div>${t?`<button class="iconact ${S.likes.includes(t.id)?'active':''}" data-action="like" data-id="${t.id}" title="Favorito">${icon('heart',17)}</button>`:''}</div><div class="playercenter"><div class="controls"><button class="ctrl secondary-ctrl ${playback.shuffle?'lit':''}" data-action="shuffle" title="Aleatorio">${icon('shuffle',16)}</button><button class="ctrl secondary-ctrl" data-action="prev" title="Anterior">${icon('previous',17)}</button><button class="ctrl-main" data-action="toggle-play" aria-label="${playback.playing?'Pausar':'Reproducir'}">${icon(playback.playing?'pause':'play',17)}</button><button class="ctrl" data-action="next" title="Siguiente">${icon('next',17)}</button><button class="ctrl secondary-ctrl ${playback.repeat?'lit':''}" data-action="repeat" title="Repetir">${icon('repeat',16)}</button></div><div class="seekrow"><span id="time-now">${fmt(playback.elapsed)}</span><input class="range" type="range" id="seek" min="0" max="24" step="1" value="${playback.elapsed}" aria-label="Avance de la vista previa"><span>0:24</span></div></div><div class="player-right">${icon('volume',17)}<input id="volume" class="range" type="range" min="0" max="1" step="0.01" value="${playback.volume}" aria-label="Volumen"><span class="pill purple">DEMO</span></div>`}
function updatePlayer(){const p=document.getElementById('player');if(p)p.innerHTML=playerHTML();}
function refresh(){if(!S.loggedIn)return draw();const m=document.getElementById('main'),y=m?m.scrollTop:0;draw();const next=document.getElementById('main');if(next)next.scrollTop=y;}
function viewRefresh(){const el=document.getElementById('view');if(el)el.innerHTML=view();updatePlayer();}
function closeModal(){document.getElementById('overlay').innerHTML='';}
function showModal(content){document.getElementById('overlay').innerHTML=`<div class="modal-back" id="modal-back"><div class="modal fade-in" role="dialog" aria-modal="true">${content}</div></div>`;}
const modalHead=(title,sub='')=>`<div class="modal-head"><div><h2>${title}</h2>${sub?`<p class="muted" style="margin:0">${sub}</p>`:''}</div><button class="btn square ghost" data-action="modal-close" aria-label="Cerrar">${icon('close',20)}</button></div>`;
function createPlaylistModal(x=null){showModal(`${modalHead(x?'Editar playlist':'Nueva playlist','Tu música, a tu manera.')}<form id="playlist-form"><input type="hidden" name="playlist_id" value="${x?.id||''}"><div class="form-field"><label>Nombre</label><input name="name" maxlength="75" required placeholder="Por ejemplo: Mis canciones favoritas" value="${escap(x?.name||'')}"></div><div class="form-field"><label>Descripción (opcional)</label><textarea name="description" maxlength="180" placeholder="¿Qué música has reunido aquí?">${escap(x?.description||'')}</textarea></div><div class="form-field"><label>Visibilidad</label><select name="public"><option value="false" ${x?.public?'':'selected'}>Privada — solo yo</option><option value="true" ${x?.public?'selected':''}>Pública — visible para la comunidad (demo local)</option></select></div><button class="btn primary" type="submit">${icon('check',16)} ${x?'Guardar playlist':'Crear playlist'}</button> ${x?`<button class="btn danger" type="button" data-action="delete-playlist" data-id="${x.id}">${icon('trash',15)} Eliminar</button>`:''}</form><p class="hint" style="margin-bottom:0">En esta demo las playlists públicas no se sincronizan con otros usuarios reales.</p>`)}
function addTrackModal(trackId,target=null){const t=song(trackId);if(target){if(t)addToList(target,trackId);return;}showModal(`${modalHead('Añadir a una playlist',t?escap(t.title):'Selecciona una canción')}<div style="display:flex;flex-direction:column;gap:8px">${S.playlists.map(x=>`<button class="navitem" style="background:#25243a" data-action="choose-playlist" data-id="${x.id}" data-track="${trackId}">${icon('list')}<span style="display:block">${escap(x.name)} <small class="small">· ${x.tracks.length} canciones</small></span>${icon(x.tracks.includes(trackId)?'check':'plus',16)}</button>`).join('')}</div><hr class="hr"><button class="btn ghost" data-action="create-playlist">${icon('plus',16)} Crear otra playlist</button>`)}
function addAnyModal(playlistId){showModal(`${modalHead('Añadir canciones','Elige pistas para tu playlist')}<div class="tracks" style="max-height:300px;overflow:auto">${SONGS.map(t=>`<button class="navitem" style="width:100%;padding:7px" data-action="choose-playlist" data-id="${playlistId}" data-track="${t.id}">${cover(t.cover,{mini:true})}<span style="flex:1;text-align:left"><strong>${escap(t.title)}</strong><small class="small"> · ${a(t.artist).name}</small></span>${icon(list(playlistId)?.tracks.includes(t.id)?'check':'plus',16)}</button>`).join('')}</div>`)}
function applyArtistModal(){if(S.artistRequest){navigate('studio');return}showModal(`${modalHead('Convertirme en artista','Un perfil musical para compartir tus creaciones.')}<form id="apply-artist-form"><div class="form-field"><label>Nombre artístico</label><input name="name" maxlength="60" required placeholder="Tu nombre como artista"></div><div class="form-field"><label>Género principal</label><select name="genre">${G.slice(1).map(g=>`<option>${g}</option>`).join('')}</select></div><div class="form-field"><label>Presentación</label><textarea name="bio" maxlength="400" required placeholder="Cuéntanos qué música creas…"></textarea></div><label class="check"><input required type="checkbox"> Entiendo que solo podré publicar música para la que tenga todos los derechos necesarios y que cada pista deberá revisarse.</label><button class="btn primary" type="submit">${icon('shield',16)} Enviar solicitud (simulación)</button><p class="hint">La solicitud quedará pendiente en esta demo. No existe todavía un equipo de verificación conectado.</p></form>`)}
function draftAlbumModal(){showModal(`${modalHead('Crear álbum o EP','Organiza un lanzamiento antes de subir sus pistas.')}<form id="draft-album-form"><div class="form-field"><label>Título</label><input name="title" required maxlength="70" placeholder="Mi primer álbum"></div><div class="form-field"><label>Tipo de lanzamiento</label><select name="type"><option>Álbum</option><option>EP</option></select></div><button class="btn primary" type="submit">${icon('plus',15)} Crear borrador</button><p class="hint">Este lanzamiento no será público.</p></form>`)}
function draftSongModal(){showModal(`${modalHead('Añadir canción','Borrador de lanzamiento · Sin subida real')}<form id="draft-song-form"><div class="form-field"><label>Título de la canción</label><input name="title" required maxlength="70" placeholder="Nombre de la pista"></div><div class="form-field"><label>¿Dónde quieres incluirla?</label><select name="album"><option value="">Single independiente</option>${S.draftAlbums.map(x=>`<option value="${x.id}">${escap(x.title)} (${x.type})</option>`).join('')}</select></div><div class="form-field"><label>Archivo de audio de prueba (opcional)</label><input type="file" name="audio" accept="audio/mpeg,audio/wav,audio/flac,audio/ogg" style="font-size:12px"><small class="hint">Solo se guarda el nombre del archivo en tu navegador; no se sube el audio.</small></div><label class="check"><input type="checkbox" required> Confirmo que tengo los derechos sobre la composición, la grabación y la base instrumental de esta canción.</label><button class="btn primary" type="submit">${icon('plus',15)} Guardar borrador local</button></form>`)}
const shareText=(x,isPublic)=>`🎧 Mi playlist en OVIO: ${x.name}\n${x.description||x.desc||''}\n${x.tracks.map((id,i)=>{const t=song(id);return t?`${i+1}. ${t.title} — ${a(t.artist).name}`:''}).join('\n')}\n\nCompartido desde una demo de OVIO (las canciones son ficticias).`;
async function copyText(text){try{await navigator.clipboard.writeText(text);notify('Copiado. Ya puedes compartirlo.')}catch(e){window.prompt('Copia el texto para compartir:',text);}}
function addToList(pid,tid){const x=list(pid);if(!x)return;if(x.tracks.includes(tid)){notify('Esta canción ya está en esa lista.');return;}x.tracks.push(tid);save();closeModal();notify('Añadida a '+x.name);refresh();}
const toggleIn=(field,id)=>{const v=S[field],i=v.indexOf(id);i===-1?v.push(id):v.splice(i,1);save();refresh();};
function listenCount(t){if(!listenMarked){listenMarked=true;S.listens[t.id]=(S.listens[t.id]||0)+1;save();if(route.name==='home'||route.name==='library')viewRefresh();}}
function silenceAudio(){if(beatTimer){clearInterval(beatTimer);beatTimer=null;}if(audioMaster){try{audioMaster.disconnect()}catch(e){}audioMaster=null}}
function note(freq,time,dur,vol,type='sine'){if(!ctx||!audioMaster)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,time);g.gain.setValueAtTime(.001,time);g.gain.exponentialRampToValueAtTime(Math.max(.002,vol),time+.015);g.gain.exponentialRampToValueAtTime(.001,time+dur);o.connect(g).connect(audioMaster);o.start(time);o.stop(time+dur+.02)}
function kick(time){if(!ctx||!audioMaster)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(130,time);o.frequency.exponentialRampToValueAtTime(45,time+.16);g.gain.setValueAtTime(.2,time);g.gain.exponentialRampToValueAtTime(.001,time+.2);o.connect(g).connect(audioMaster);o.start(time);o.stop(time+.21)}
function tickAudio(){if(!ctx||!playback.playing)return;const t=song(playback.id);if(!t)return;const at=ctx.currentTime+.008;const shift=(t.cover%5)*2;const bass=[110,123.47,130.81,146.83,164.81,196,174.61,146.83];const root=bass[(Math.floor(activeBeat/8)+shift)%bass.length];if(activeBeat%4===0){kick(at);note(root,at,.28,.075,'triangle')}if(activeBeat%8===4)note(195,at,.045,.02,'sawtooth');if(activeBeat%2===0)note(root*2*Math.pow(2,[0,3,7,10][(activeBeat/2+t.cover)%4]/12),at,.17,.025,t.genre==='Electrónica'?'sawtooth':'sine');if(activeBeat%2===1)note(1800,at,.025,.003,'square');activeBeat++;}
function startSynth(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();silenceAudio();audioMaster=ctx.createGain();audioMaster.gain.value=playback.volume*.75;audioMaster.connect(ctx.destination);activeBeat=0;tickAudio();const t=song(playback.id);const bpm=({Trap:100,Indie:112,'Electrónica':126,Pop:116,Rap:92,'R&B':88,Urbano:108})[t.genre]||104;beatTimer=setInterval(tickAudio,60000/bpm/2);}catch(e){notify('El navegador no permite iniciar audio sintético. Puedes seguir explorando la interfaz.')}}
function playTrack(id,reset=true){const t=song(id);if(!t)return;const was=playback.id===id;if(was&&playback.playing&&reset){pauseTrack();return}playback.id=id;playback.playing=true;if(!was||reset)playback.elapsed=0;listenMarked=false;S.history=[id,...S.history.filter(x=>x!==id)].slice(0,40);save();startSynth();if(progressTimer)clearInterval(progressTimer);progressTimer=setInterval(()=>{if(!playback.playing)return;playback.elapsed=Math.min(24,playback.elapsed+.25);if(playback.elapsed>=4)listenCount(t);const slider=document.getElementById('seek'),time=document.getElementById('time-now');if(slider)slider.value=String(playback.elapsed);if(time)time.textContent=fmt(playback.elapsed);if(playback.elapsed>=24){if(playback.repeat){playback.elapsed=0;listenMarked=true;}else nextTrack();}},250);updatePlayer();}
function pauseTrack(){playback.playing=false;silenceAudio();clearInterval(progressTimer);progressTimer=null;updatePlayer()}
function resumeTrack(){if(!playback.id){playTrack('t1');return}playback.playing=true;startSynth();if(progressTimer)clearInterval(progressTimer);progressTimer=setInterval(()=>{if(!playback.playing)return;playback.elapsed=Math.min(24,playback.elapsed+.25);const t=song(playback.id);if(playback.elapsed>=4&&t)listenCount(t);const slider=document.getElementById('seek'),time=document.getElementById('time-now');if(slider)slider.value=String(playback.elapsed);if(time)time.textContent=fmt(playback.elapsed);if(playback.elapsed>=24){if(playback.repeat){playback.elapsed=0;listenMarked=true;}else nextTrack();}},250);updatePlayer();}
function nextTrack(back=false){const ix=SONGS.findIndex(x=>x.id===playback.id);if(playback.shuffle)return playTrack(SONGS[Math.floor(Math.random()*SONGS.length)].id);playTrack(SONGS[(ix+(back?-1:1)+SONGS.length)%SONGS.length].id)}
function eventClick(e){const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action,id=b.dataset.id;switch(act){case'nav':navigate(b.dataset.route);break;case'back':navigate('home');break;case'album':case'artist':case'playlist':case'publicplaylist':navigate(act,id);break;case'play':playTrack(id);break;case'like':toggleIn('likes',id);break;case'save-album':toggleIn('savedAlbums',id);break;case'follow':toggleIn('follows',id);break;case'feed-like':toggleIn('feedLikes',id);break;case'save-public':toggleIn('followedPublic',id);break;case'library-tab':libraryTab=id;viewRefresh();break;case'genre':if(b.dataset.scope==='explore'){exploreGenre=b.dataset.genre;navigate('explore')}else{radarGenre=b.dataset.genre;navigate('radar')}break;case'search-genre':searchTerm=b.dataset.genre;navigate('search');break;case'create-playlist':createPlaylistModal();break;case'edit-playlist':createPlaylistModal(list(id));break;case'add-track':addTrackModal(id);break;case'add-any':addAnyModal(id);break;case'choose-playlist':addToList(id,b.dataset.track);break;case'modal-close':closeModal();break;case'delete-playlist':if(confirm('¿Quieres eliminar esta playlist local?')){S.playlists=S.playlists.filter(x=>x.id!==id);save();closeModal();navigate('library');notify('Playlist eliminada.')}break;case'share-playlist':{const x=b.dataset.public==='1'?publicList(id):list(id);if(x){copyText(shareText(x,b.dataset.public==='1'));notify('Comparte el texto de esta playlist de demostración.')}break;}case'share-song':{const t=song(id);copyText(`🎵 ${t.title} — ${a(t.artist).name}\nDescubierto en OVIO (demo, audio ficticio).`);break;}case'artist-apply':applyArtistModal();break;case'draft-album':if(!S.artistRequest){notify('Primero solicita el perfil de artista.');break;}draftAlbumModal();break;case'draft-song':if(!S.artistRequest){notify('Primero solicita el perfil de artista.');break;}draftSongModal();break;case'settings':navigate('settings');break;case'remove-avatar':S.user.photo='';save();refresh();notify('Foto eliminada.');break;case'logout':pauseTrack();S.loggedIn=false;save();draw();break;case'clear-history':if(confirm('¿Borrar historial y recuentos de escucha en este navegador?')){S.history=[];S.listens={};save();refresh();notify('Historial borrado.')}break;case'prev':nextTrack(true);break;case'next':nextTrack();break;case'toggle-play':playback.playing?pauseTrack():resumeTrack();break;case'shuffle':playback.shuffle=!playback.shuffle;updatePlayer();break;case'repeat':playback.repeat=!playback.repeat;updatePlayer();break;}}
function eventSubmit(e){if(!['signin','playlist-form','apply-artist-form','settings-form','draft-album-form','draft-song-form'].includes(e.target.id))return;e.preventDefault();const form=e.target,data=new FormData(form);switch(form.id){case'signin':S.user.name=String(data.get('name')||'Alex').trim().slice(0,40);S.loggedIn=true;save();navigate('home');break;case'playlist-form':{const name=String(data.get('name')||'').trim().slice(0,75);if(!name)break;const prev=list(data.get('playlist_id'));if(prev){prev.name=name;prev.description=String(data.get('description')||'').slice(0,180);prev.public=data.get('public')==='true';}else{const p={id:'p'+Date.now(),name,description:String(data.get('description')||'').slice(0,180),public:data.get('public')==='true',tracks:[],cover:S.playlists.length%8};S.playlists.push(p);route={name:'playlist',id:p.id};}save();closeModal();refresh();notify(prev?'Playlist actualizada.':'Playlist creada.');break;}case'apply-artist-form':S.artistRequest={name:String(data.get('name')||'').slice(0,60),genre:String(data.get('genre')||'Pop'),bio:String(data.get('bio')||'').slice(0,400),status:'pending'};save();closeModal();navigate('studio');notify('Solicitud guardada localmente como pendiente.');break;case'settings-form':S.user.name=String(data.get('name')||'Alex').trim().slice(0,40);S.user.bio=String(data.get('bio')||'').slice(0,250);S.user.city=String(data.get('city')||'').slice(0,60);save();navigate('profile');notify('Perfil actualizado.');break;case'draft-album-form':S.draftAlbums.push({id:'da'+Date.now(),title:String(data.get('title')||'').slice(0,70),type:data.get('type')});save();closeModal();refresh();notify('Álbum en borradores.');break;case'draft-song-form':{const file=form.querySelector('[name="audio"]').files[0];S.draftSongs.push({id:'ds'+Date.now(),title:String(data.get('title')||'').slice(0,70),album:String(data.get('album')||''),fileName:file?file.name:'Sin audio seleccionado'});save();closeModal();refresh();notify('Borrador local guardado. No se ha subido ningún audio.');break;}}}
document.addEventListener('click',eventClick);
document.addEventListener('submit',eventSubmit);
document.addEventListener('input',e=>{if(e.target.id==='search-input'){searchTerm=e.target.value;const node=document.getElementById('search-results');if(node)node.innerHTML=searchResults();}if(e.target.id==='volume'){playback.volume=Number(e.target.value);if(audioMaster)audioMaster.gain.value=playback.volume*.75;}if(e.target.id==='seek'){playback.elapsed=Number(e.target.value);listenMarked=playback.elapsed>=4;const label=document.getElementById('time-now');if(label)label.textContent=fmt(playback.elapsed);}});
document.addEventListener('change',e=>{if(e.target.id==='avatar-file'){const file=e.target.files?.[0];if(!file)return;if(file.size>500*1024){notify('Elige una imagen de hasta 500 KB.');return;}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){notify('Formato no compatible.');return;}const reader=new FileReader();reader.onload=()=>{S.user.photo=reader.result;save();refresh();notify('Foto actualizada.');};reader.readAsDataURL(file);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&S.loggedIn){e.preventDefault();navigate('search');document.getElementById('search-input')?.focus();}if(e.code==='Space'&&!['INPUT','TEXTAREA','BUTTON','SELECT'].includes(document.activeElement?.tagName)&&S.loggedIn){e.preventDefault();playback.playing?pauseTrack():resumeTrack();}if((e.key==='Enter'||e.key===' ')&&e.target?.matches('.playlist-tile[data-action]')){e.preventDefault();e.target.click();}});
document.addEventListener('click',e=>{if(e.target.id==='modal-back')closeModal();});
draw();
</script></body></html>
